<script>
(async function () {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
                  del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  async function unlock(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b(P.salt), iterations: P.iter },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.iv) }, key, b(P.ct));
    return new TextDecoder().decode(pt);
  }
  async function attempt(pw, remember) {
    const go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; go.textContent = "Decrypting…"; err.textContent = "";
    try {
      const html = await unlock(pw);
      if (remember) store.set("pt-pass", pw);
      document.open(); document.write(html); document.close();
    } catch (e) {
      store.del("pt-pass");
      err.textContent = "Wrong passphrase.";
      go.disabled = false; go.textContent = "Unlock";
    }
  }
  if (!window.crypto || !crypto.subtle) {
    document.getElementById("err").textContent = "This browser can't decrypt (needs HTTPS and WebCrypto).";
    return;
  }
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    attempt(document.getElementById("pw").value, document.getElementById("rem").checked);
  });
  const saved = store.get("pt-pass");
  if (saved) attempt(saved, true);
})();
</script></body></html>
